org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Gradle must run on JDK 21, matching CI; gradle/gradle-daemon-jvm.properties pins the daemon and
# jvmToolchain(21) pins the compiler. To point at a JDK already on this machine instead of
# downloading one, add to ~/.gradle/gradle.properties (a path here would be machine-specific):
#
#   org.gradle.java.installations.paths=/home/you/.local/jdks/temurin-21

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
