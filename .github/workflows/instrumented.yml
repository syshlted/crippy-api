name: instrumented

# The device tests (L13), on emulators: the client over a real Binder against a stand-in service in a
# process of its own. encri is closed source (encri D116) and no build of it is here, so the suite
# against the real encri skips itself on these emulators; it runs on phones, by
# scripts/device/run-device-tests.sh.

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'   # weekly: an emulator image or a platform change, with nothing pushed

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

jobs:
  androidTest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two ends of the range the library promises, as the Robolectric suite has (L8):
        # 27 is minSdk and encri's floor (encri D14), 36 the platform this compiles against.
        api-level: [27, 36]
    steps:
      # Pinned to the same SHAs encri pins (encri D7, L3).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          disable-animations: true
          script: scripts/hooks/gradle-task connectedDebugAndroidTest

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: androidTest-api${{ matrix.api-level }}
          path: '**/build/outputs/androidTest-results/**'
          if-no-files-found: ignore
          retention-days: 14
