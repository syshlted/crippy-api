# Single source of truth for dependency versions.
#
# The toolchain is crippy's, version for version (AGENTS.md L3): crippy compiles its service against
# :contract, and the file manager compiles against both modules, so a bump is made in all three
# repositories together or not at all. Nothing here is the contract's version, which is a constant in
# the .aidl file it describes (L2).

[versions]
agp = "9.4.1"
ktlint = "1.8.0"
ktlintPlugin = "14.2.0"
detekt = "1.23.8"
kover = "0.9.9"
junit = "5.14.4"

# minSdk 27, crippy's floor (crippy D14) and therefore the lowest level a client can ever find crippy
# on. L1 records why a lower floor was not taken.
minSdk = "27"
compileSdk = "36"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
