# Single source of truth for dependency versions.
#
# The toolchain is crippy's, version for version (AGENTS.md L3): crippy compiles its service against
# crippy-contract, and the file manager against crippy-client, so a bump is made in all three
# repositories together or not at all. Nothing here is the contract's version, which is a constant in
# the .aidl file it describes (L2).

[versions]
agp = "9.4.1"
# Newer than the 2.2.10 AGP 9.4.1 depends on, which has a build-cache deserialization flaw fixed in 2.4.20
# (GHSA-r937-wjx7-w2jp). On the root classpath, so AGP's built-in Kotlin compiles with it too (L9).
kotlin = "2.4.21"
ktlint = "1.8.0"
ktlintPlugin = "14.2.0"
detekt = "1.23.8"
kover = "0.9.9"
junit = "5.14.4"
# A real android.os.Parcel and Binder off a device, which the mockable android.jar does not have:
# the generated proxy cannot run without them (L8).
robolectric = "4.17"
# The client's API is suspend functions and a SharedFlow (L12), so an app receives this through `api`.
coroutines = "1.10.2"
# The device tests (L13): crippy's versions, so every artifact they bring is one crippy's build already verifies.
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"

# minSdk 27, crippy's floor (crippy D14) and therefore the lowest level a client can ever find crippy
# on. L1 records why a lower floor was not taken.
minSdk = "27"
compileSdk = "36"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
junit4 = { module = "junit:junit", version = "4.13.2" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# The API dumps' reader (L16): Kotlin's own view of a declaration's visibility, which the bytecode does not keep.
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
