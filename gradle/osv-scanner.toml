# Advisories in the build's own tooling that have been read and accepted (AGENTS.md L10). None of these
# packages ships in either AAR: the release runtime classpaths are scanned separately, with nothing
# accepted. Each entry says why the flaw cannot be reached from this build, and expires so that it comes
# back for review instead of being ignored for good. An advisory not listed here is one nobody has read
# yet, and the weekly scan reports it.
#
# None can be fixed by a bump: AGP 9.4.1 is the newest stable AGP, Kover 0.9.11 carries the same
# freemarker, and ktlint 1.8.0 is ktlint's newest release. Forcing newer versions under them would swap
# a combination their authors tested for one nobody did, to patch code a library build never runs.

# logback 1.3.16, through ktlint 1.8.0
[[IgnoredVulns]]
id = "GHSA-jhq6-gfmj-v8fx"
ignoreUntil = 2027-01-22
reason = "Reached by serialized data sent to logback's SimpleSocketServer; ktlint runs no socket server."

[[IgnoredVulns]]
id = "GHSA-p47f-322f-whfh"
ignoreUntil = 2027-01-22
reason = "Reached by serialized data sent to logback's SimpleSocketServer; ktlint runs no socket server."

[[IgnoredVulns]]
id = "GHSA-qqpg-mvqg-649v"
ignoreUntil = 2027-01-22
reason = "Needs write access to a logback configuration file; ktlint uses the one in its own jar."

# commons-lang3 3.16.0, through AGP and Android lint
[[IgnoredVulns]]
id = "GHSA-j288-q9x7-2f5v"
ignoreUntil = 2027-01-22
reason = "ClassUtils.getClass overflows its stack on a very long name; the names come from this build, and the worst case is a failed build."

# httpclient 4.5.6, through AGP's SDK tools
[[IgnoredVulns]]
id = "GHSA-7r82-7xv7-xcpj"
ignoreUntil = 2027-01-22
reason = "Needs a malformed request URI chosen by an attacker; AGP's SDK tools request fixed repository URLs."

# jose4j 0.9.5, through AGP's bundletool
[[IgnoredVulns]]
id = "GHSA-3677-xxcr-wjqv"
ignoreUntil = 2027-01-22
reason = "A denial of service on decrypting a crafted JWE; bundletool builds app bundles, and a library build never runs it."

# Bouncy Castle 1.80.2, through AGP and Android lint
[[IgnoredVulns]]
id = "GHSA-wg6q-6289-32hp"
ignoreUntil = 2027-01-22
reason = "Composite signatures verified by bcpkix; a library build verifies no signature."

[[IgnoredVulns]]
id = "GHSA-9pwp-9qqc-pr26"
ignoreUntil = 2027-01-22
reason = "Name constraints in certificate path validation; a library build validates no certificate path."

[[IgnoredVulns]]
id = "GHSA-c3fc-8qff-9hwx"
ignoreUntil = 2027-01-22
reason = "LDAP injection in LDAPStoreHelper; nothing in the build makes an LDAP query."

[[IgnoredVulns]]
id = "GHSA-qp49-qgx5-5m26"
ignoreUntil = 2027-01-22
reason = "Unbounded nesting in crafted ASN.1; the only ASN.1 the build reads is its own."

# freemarker 2.3.32, through Kover's report
[[IgnoredVulns]]
id = "GHSA-27j2-h3m2-8237"
ignoreUntil = 2027-01-22
reason = "Path traversal needs an attacker-chosen locale; Kover renders its own templates in a locale it sets."

# jdom2 2.0.6, through AGP's jetifier
[[IgnoredVulns]]
id = "GHSA-2363-cqg2-863c"
ignoreUntil = 2027-01-22
reason = "XXE when jetifier parses a dependency's XML; jetifier is off, since android.enableJetifier is unset."
